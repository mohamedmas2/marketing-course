                                الاهتمام البالغ باستصلاح الأراضي، شق الترع وتطوير نظم الري، إلى جانب التنوع والازدهار في الصناعات الكبرى كصناعة النسيج، الورق، والسفن.
                            </div>
                        </details>

                        <details class="group bg-white border border-sky-200 rounded-lg shadow-sm">
                            <summary class="flex items-center justify-between p-3 font-bold cursor-pointer text-sky-900 group-open:bg-sky-50 transition-colors rounded-t-lg list-none [&::-webkit-details-marker]:hidden">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-coins text-gold-500 w-5 text-center"></i> 4. امتلاك نظام مالي مستقل</div>
                                <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180 text-gray-400"></i>
                            </summary>
                            <div class="p-4 text-sm text-gray-700 border-t border-sky-100 leading-relaxed bg-gray-50">
                                تأسيس مؤسسات مالية محكمة (مثل بيت المال)، وسك عملة إسلامية مستقلة، وتطبيق نظام مالي عادل يعتمد على الزكاة والخراج.
                            </div>
                        </details>

                        <details class="group bg-white border border-sky-200 rounded-lg shadow-sm">
                            <summary class="flex items-center justify-between p-3 font-bold cursor-pointer text-sky-900 group-open:bg-sky-50 transition-colors rounded-t-lg list-none [&::-webkit-details-marker]:hidden">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-users-gear text-gold-500 w-5 text-center"></i> 5. تنوع القوى العاملة</div>
                                <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180 text-gray-400"></i>
                            </summary>
                            <div class="p-4 text-sm text-gray-700 border-t border-sky-100 leading-relaxed bg-gray-50">
                                استقطاب الكفاءات والمهارات من مختلف الشعوب والثقافات التي انضوت تحت راية الإسلام، مما أثرى الفكر الإداري والمهني بخبرات وقدرات متنوعة.
                            </div>
                        </details>

                        <details class="group bg-white border border-sky-200 rounded-lg shadow-sm">
                            <summary class="flex items-center justify-between p-3 font-bold cursor-pointer text-sky-900 group-open:bg-sky-50 transition-colors rounded-t-lg list-none [&::-webkit-details-marker]:hidden">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-microscope text-gold-500 w-5 text-center"></i> 6. التقدم في البحث العلمي</div>
                                <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180 text-gray-400"></i>
                            </summary>
                            <div class="p-4 text-sm text-gray-700 border-t border-sky-100 leading-relaxed bg-gray-50">
                                تشجيع العلم والعلماء، إنشاء دور الحكمة ومراكز الترجمة، والتفوق والابتكار في مختلف العلوم التجريبية كالطب والهندسة وغيرها.
                            </div>
                        </details>

                        <details class="group bg-white border border-sky-200 rounded-lg shadow-sm">
                            <summary class="flex items-center justify-between p-3 font-bold cursor-pointer text-sky-900 group-open:bg-sky-50 transition-colors rounded-t-lg list-none [&::-webkit-details-marker]:hidden">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-shield-halved text-gold-500 w-5 text-center"></i> 7. الأمن ودمج الأقليات</div>
                                <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180 text-gray-400"></i>
                            </summary>
                            <div class="p-4 text-sm text-gray-700 border-t border-sky-100 leading-relaxed bg-gray-50">
                                إرساء قواعد العدل والمساواة، توفير الأمن الشامل، ونجاح الدولة في دمج الأقليات غير المسلمة في المجتمع والإدارة وحفظ حقوقهم بناءً على الكفاءة.
                            </div>
                        </details>
                    </div>
                `
            },
            decline: {
                step: "8 من 8",
                icon: "fa-arrow-trend-down",
                title: "8. أسباب الضعف والانهيار",
                subtitle: "تراجع المنظمات والدول (غياب الرقابة)",
                content: `
                    <div class="space-y-4">
                        <p class="font-bold text-gray-800">سنن الله في الكون لا تحابي أحداً، عندما يتم تجاهل وظائف الإدارة (خاصة الرقابة والتنظيم الصحيح) يبدأ الانهيار.</p>
                        
                        <div class="bg-red-50 p-5 rounded-xl border border-red-200">
                            <h4 class="font-bold text-red-900 mb-3 border-b border-red-200 pb-2">عوامل السقوط والتراجع الإداري:</h4>
                            <ul class="space-y-3">
                                <li class="flex items-start gap-3">
                                    <div class="bg-red-100 text-red-700 p-1 rounded mt-1"><i class="fa-solid fa-xmark w-4 h-4 text-center"></i></div>
                                    <div><strong>ضعف الرقابة الرئاسية:</strong> عدم وجود نظام لمحاسبة المسؤولين ومتابعة الانحرافات.</div>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="bg-red-100 text-red-700 p-1 rounded mt-1"><i class="fa-solid fa-xmark w-4 h-4 text-center"></i></div>
                                    <div><strong>الفساد الإداري:</strong> استغلال المناصب لتحقيق مصالح شخصية، والمحسوبية في التعيينات.</div>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="bg-red-100 text-red-700 p-1 rounded mt-1"><i class="fa-solid fa-xmark w-4 h-4 text-center"></i></div>
                                    <div><strong>تراخي الانضباط:</strong> انشغال المسؤولين عن واجباتهم وإهمال مصالح الرعية أو الموظفين.</div>
                                </li>
                                <li class="flex items-start gap-3">
                                    <div class="bg-red-100 text-red-700 p-1 rounded mt-1"><i class="fa-solid fa-xmark w-4 h-4 text-center"></i></div>
                                    <div><strong>تولية غير الأكفاء:</strong> الانحراف عن المبادئ الأساسية للعدل وتولية المناصب لغير المستحقين، مما أدى لتفكك المنظومة وضعف الأداء العام.</div>
                                </li>
                            </ul>
                        </div>
                    </div>
                `
            }
        };

        const dataKeys = Object.keys(modalData);
        let currentActiveKey = null;

        // توليد أزرار القائمة الجانبية
        const sidebarMenu = document.getElementById('sidebarMenu');
        dataKeys.forEach((key, index) => {
            const item = modalData[key];
            const btn = document.createElement('button');
            btn.id = `btn-${key}`;
            btn.className = "w-full text-right px-4 py-3 rounded-lg flex items-center gap-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-all text-sm focus:outline-none font-medium";
            btn.innerHTML = `
                <span class="w-6 h-6 rounded-full bg-gray-800 text-gold-400 flex items-center justify-center text-xs font-bold shrink-0">${index + 1}</span>
                <span class="truncate">${item.title.split('.')[1] || item.title}</span>
            `;
            btn.onclick = () => {
                showContent(key);
                if (window.innerWidth < 768) toggleSidebar();
            };
            sidebarMenu.appendChild(btn);
        });

        // عرض المحتوى بالتفصيل
        function showContent(key) {
            currentActiveKey = key;
            const data = modalData[key];
            
            // تحديث ستايل الأزرار الجانبية والنشط منها
            dataKeys.forEach(k => {
                const el = document.getElementById(`btn-${k}`);
                if (k === key) {
                    el.classList.add('bg-emerald-800', 'text-white', 'font-bold');
                    el.classList.remove('text-gray-300', 'hover:bg-gray-800');
                } else {
                    el.classList.remove('bg-emerald-800', 'text-white', 'font-bold');
                    el.classList.add('text-gray-300', 'hover:bg-gray-800');
                }
            });

            // تعبئة البيانات
            document.getElementById('contentIcon').innerHTML = `<i class="fa-solid ${data.icon}"></i>`;
            document.getElementById('contentTitle').innerText = data.title;
            document.getElementById('contentSubtitle').innerText = data.subtitle;
            document.getElementById('contentStep').innerText = "المحور: " + data.step;
            
            // حقن النص الأصلي بالكامل
            document.getElementById('contentBody').innerHTML = data.content;

            // تطبيق وظيفة البحث والتمييز في حال وجود نص بخانة البحث
            handleSearch();

            // إعداد أزرار التالي والسابق
            const currentIndex = dataKeys.indexOf(key);
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === dataKeys.length - 1;

            // التمرير لأعلى الصفحة بسلاسة عند تغيير القسم
            document.querySelector('main').scrollTop = 0;
        }

        // دالة التحكم في أزرار التنقل
        function navigateContent(direction) {
            if (!currentActiveKey) return;
            const currentIndex = dataKeys.indexOf(currentActiveKey);
            let nextIndex = direction === 'next' ? currentIndex + 1 : currentIndex - 1;
            
            if (nextIndex >= 0 && nextIndex < dataKeys.length) {
                showContent(dataKeys[nextIndex]);
            }
        }

        // محرك البحث المتقدم لتلوين الكلمات بالأصفر دون إتلاف وسوم الـ HTML نهائياً
        function handleSearch() {
            if (!currentActiveKey) return;
            
            const searchInput = document.getElementById('searchInput');
            const term = searchInput.value.trim();
            const bodyEl = document.getElementById('contentBody');
            
            // إعادة المحتوى لأصله النظيف قبل البدء بالفلترة
            bodyEl.innerHTML = modalData[currentActiveKey].content;

            if (!term) return;

            // بناء التعبير المنتظم للبحث بشكل آمن
            const regex = new RegExp('(' + term.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + ')', 'gi');
            
            // دالة التنقل داخل العقد النصية فقط
            function highlightNode(node, rx) {
                if (node.nodeType === 3) { // العقد النصية فقط Text node
                    const text = node.nodeValue;
                    if (rx.test(text)) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = text.replace(rx, '<mark class="bg-yellow-300 text-black font-semibold px-0.5 rounded">$&</mark>');
                        const fragment = document.createDocumentFragment();
                        while (tempDiv.firstChild) {
                            fragment.appendChild(tempDiv.firstChild);
                        }
                        node.parentNode.replaceChild(fragment, node);
                    }
                } else if (node.nodeType === 1 && node.nodeName !== 'MARK' && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
                    // تجنب العبث بوسوم التنسيق
                    const children = Array.from(node.childNodes);
                    for (let i = 0; i < children.length; i++) {
                        highlightNode(children[i], rx);
                    }
                }
            }
            
            highlightNode(bodyEl, regex);
        }

        // إظهار وإخفاء القائمة الجانبية (شاشات الهواتف)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const menuIcon = document.getElementById('menuIcon');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                sidebar.classList.add('translate-x-0');
                overlay.classList.remove('hidden');
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
            } else {
                sidebar.classList.remove('translate-x-0');
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
            }
        }

        // تشغيل الباب الأول فور تحميل الصفحة للحصول على تجربة تصفح فورية ممتازة
        window.onload = () => {
            showContent('intro');
        };
    </script>
</body>
